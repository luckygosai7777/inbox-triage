<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="32" height="32">
  <!--
    The browser-tab mark. Standalone by necessity: a favicon is fetched outside
    the page, so it cannot read the theme's CSS variables and every colour here
    is literal. Kept in sync with components/Logo.tsx by hand — there are only
    three values.

    Drawn slightly heavier than the in-app mark. At 16px the arrowhead is the
    first thing to disappear, and without it a circular arrow is just a ring.
  -->
  <rect width="100" height="100" rx="22" fill="#faf8f4"/>
  <circle cx="50" cy="50" r="21" fill="#f1faf4"/>
  <path d="M79.4 33 A34 34 0 1 1 58.8 17.2" stroke="#1a1714" stroke-width="13" stroke-linecap="round" fill="none"/>
  <path d="M53.3 26.1 L67.5 19.5 L58.5 6.7" stroke="#1a1714" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M36 51.5 L45.5 61 L64.5 38.5" stroke="#22a55f" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
